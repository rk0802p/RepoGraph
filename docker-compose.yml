services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repograph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repograph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repograph_secret}
      POSTGRES_DB: ${POSTGRES_DB:-repograph_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - repograph_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repograph} -d ${POSTGRES_DB:-repograph_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: repograph-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - repograph_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  repograph_pgdata:
  repograph_redisdata:
